services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pacepartner
      POSTGRES_PASSWORD: pacepartner
      POSTGRES_DB: pacepartner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pacepartner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
